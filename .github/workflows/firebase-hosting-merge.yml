name: Deploy to Firebase
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0' 
          channel: 'main'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: |
          flutter build web --release \
          --dart-define=apiKey=${{ secrets.APIKEY }} \
          --dart-define=authDomain=${{ secrets.AUTHDOMAIN }} \
          --dart-define=projectId=${{ secrets.PROJECTID }} \
          --dart-define=storageBucket=${{ secrets.STORAGEBUCKET }} \
          --dart-define=messagingSenderId=${{ secrets.MESSAGINGSENDERID }} \
          --dart-define=appId=${{ secrets.APPID }} \


      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - run: npm install -g firebase-tools
      - run: firebase deploy


      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FPL_FRONTEND }}
          projectId: fpl-frontend
          channelId: live

